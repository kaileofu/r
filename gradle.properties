# ===================== 构建环境 =====================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# ===================== Minecraft / NeoForge =====================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 版本：SlashBlade: Resharped 2.1.9 要求 21.1.249+
neo_version=21.1.249
neo_version_range=[21.1.0,)
# FML loader 版本（NeoForge 1.21.x 为 4.x）
loader_version_range=[4,)

# 可选 Parchment 映射
parchment_mappings_version=2024.11.17

# ===================== 模组信息 =====================
mod_id=murasame
mod_name=Murasame
mod_license=MIT
mod_version=1.0.0-neoforge-1.21.1
mod_group_id=cn.adwadg.murasame
mod_authors=adwadg
mod_description=A NeoForge 1.21.1 port skeleton of the Murasame (丛雨丸) SlashBlade addon.

# ===================== 前置模组 =====================
# SlashBlade: Resharped 的最低版本（neoforge.mods.toml 里的 versionRange 用）
slashblade_version=2.0.3
